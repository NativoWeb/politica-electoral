    <path d="M256 45 C230 55, 195 48, 175 60 C155 72, 148 95, 135 110 C122 125, 105 128, 95 145 C85 162, 82 178, 75 198 C68 218, 55 230, 50 250 C45 270, 48 285, 45 305 C42 325, 35 338, 38 358 C41 378, 52 390, 58 408 C64 426, 65 440, 75 455 C85 470, 102 472, 115 478 C128 484, 140 482, 155 485 C170 488, 182 492, 198 492 C214 492, 228 488, 242 485 C256 482, 265 480, 278 478 C291 476, 302 478, 315 475 C328 472, 338 465, 350 458 C362 451, 372 442, 382 432 C392 422, 398 412, 405 398 C412 384, 418 372, 420 355 C422 338, 418 325, 418 308 C418 291, 422 278, 420 260 C418 242, 412 230, 408 215 C404 200, 402 188, 395 175 C388 162, 378 155, 372 142 C366 129, 365 118, 355 108 C345 98, 332 95, 320 88 C308 81, 298 75, 285 68 C272 61, 268 52, 256 45Z" fill="#003B71"/>
  </g>

  <!-- Shield border -->
