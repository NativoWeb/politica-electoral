    <!-- Yellow (top half) -->
    <rect x="55" y="25" width="402" height="230" fill="#FCD116"/>
    <!-- Blue (quarter) -->
    <rect x="55" y="255" width="402" height="115" fill="#003893"/>
    <!-- Red (quarter) -->
    <rect x="55" y="370" width="402" height="125" fill="#CE1126"/>
